name: Museum validation
on:
  push:
    branches: [release/museum-current-v2, feat/majlis-of-time-v2]
    paths: ['museum/**', 'railway.json', '.github/workflows/museum.yml']
  pull_request:
    paths: ['museum/**', 'railway.json', '.github/workflows/museum.yml']
jobs:
  museum:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: museum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: museum/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
